<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="mark" aria-hidden="true">K</div>
      <div class="title-block">
        <h1>Keel</h1>
        <p id="context-line">Looking for your page</p>
      </div>
      <label class="walkaway" title="Keep working while you step away, then notify you">
        <input id="walkaway-toggle" type="checkbox" />
        <span>Walk away</span>
      </label>
    </header>

    <section id="vision" class="vision" aria-label="What Keel can see">
      <img id="vision-shot" class="vision-shot" alt="Latest capture of your tab" hidden />
      <div class="vision-text">
        <strong id="vision-title">Not reading anything yet</strong>
        <span id="vision-detail">Open the page you want help with.</span>
      </div>
      <button id="vision-toggle" class="vision-toggle" type="button" title="Turn screen capture on or off">Screen: on</button>
    </section>

    <main>
      <div id="thread" class="thread" aria-live="polite"></div>
    </main>

    <footer class="composer">
      <div id="voice-hint" class="voice-hint" hidden>Listening. Tap the mic again to send.</div>
      <div class="composer-row">
        <button id="attach-button" class="icon-button" type="button" title="Upload a file (resume, cover letter, notes)" aria-label="Upload a file">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="composer-input" rows="1" placeholder="Talk to Keel"></textarea>
        <button id="mic-button" class="icon-button" type="button" title="Talk instead of typing" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="send-button" class="icon-button send" type="button" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <input id="file-input" type="file" hidden />
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
