<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keel v0 test application</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #17231f; background: #edf3f0; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px 18px 80px; }
      main { width: min(720px, 100%); margin: auto; border: 1px solid #d5e0dc; border-radius: 20px; padding: 30px; background: white; box-shadow: 0 18px 60px rgba(23,50,42,.08); }
      .tag { color: #0d7355; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 8px 0; }
      .intro { margin: 0 0 28px; color: #66746f; }
      fieldset { display: grid; gap: 16px; margin: 24px 0; border: 0; border-top: 1px solid #dce5e1; padding: 24px 0 0; }
      legend { padding: 0 12px 0 0; font-weight: 800; }
      label, .question { display: grid; gap: 7px; font-size: 13px; font-weight: 700; }
      input, select, textarea { width: 100%; border: 1px solid #becdc7; border-radius: 9px; padding: 11px 12px; font: inherit; font-weight: 400; }
      input:focus, select:focus, textarea:focus { border-color: #0d7355; outline: 3px solid rgba(13,115,85,.12); }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .question { margin: 0; border: 0; padding: 0; }
      .question legend { margin-bottom: 9px; padding: 0; font-size: 13px; }
      .choice { display: flex; align-items: center; gap: 8px; font-weight: 500; }
      .choice input { width: auto; }
      button { border: 0; border-radius: 10px; padding: 12px 18px; color: white; background: #0d7355; font: 750 14px/1 system-ui; }
      #result { margin-left: 12px; color: #0d7355; font-weight: 700; }
      @media (max-width: 560px) { main { padding: 22px; } .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">Keel acceptance fixture</div>
      <h1>Product Designer application</h1>
      <p class="intro">This local form does not send data anywhere. It exists only to exercise the extension's controlled fill loop.</p>

      <form id="application">
        <fieldset>
          <legend>Contact details</legend>
          <div class="row">
            <label>First name *<input name="first_name" autocomplete="given-name" required /></label>
            <label>Last name *<input name="last_name" autocomplete="family-name" required /></label>
          </div>
          <label>Email address *<input name="email" type="email" autocomplete="email" required /></label>
          <label>Phone number *<input name="phone" type="tel" autocomplete="tel" required /></label>
          <label>Street address *<input name="street" autocomplete="address-line1" required /></label>
          <div class="row">
            <label>City *<input name="city" autocomplete="address-level2" required /></label>
            <label>State / region *<input name="state" autocomplete="address-level1" required /></label>
            <label>Postal code *<input name="postal" autocomplete="postal-code" required /></label>
            <label>Country *<select name="country" autocomplete="country-name" required>
              <option value="">Choose one</option>
              <option>United States</option>
              <option>Canada</option>
              <option>United Kingdom</option>
              <option>Germany</option>
              <option>India</option>
              <option>Australia</option>
            </select></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Professional profile</legend>
          <div class="row">
            <label>Current company *<input name="current_company" required /></label>
            <label>Current job title *<input name="job_title" required /></label>
          </div>
          <label>LinkedIn profile URL *<input name="linkedin_url" type="url" required /></label>
          <label>Portfolio URL<input name="portfolio_url" type="url" /></label>
          <label>Professional experience<textarea name="experience_summary" rows="5"></textarea></label>
        </fieldset>

        <fieldset>
          <legend>Application questions</legend>
          <label>Will you now or in the future require employment sponsorship? *
            <select name="sponsorship" required>
              <option value="">Choose one</option>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </label>
          <fieldset class="question">
            <legend>How did you hear about us? *</legend>
            <label class="choice"><input type="radio" name="source" value="LinkedIn" required /> LinkedIn</label>
            <label class="choice"><input type="radio" name="source" value="Referral" required /> Employee referral</label>
            <label class="choice"><input type="radio" name="source" value="Other" required /> Other</label>
          </fieldset>
          <label class="choice"><input type="checkbox" name="updates" /> Send me optional recruiting updates</label>
          <label>Resume (PDF) *<input name="resume" type="file" accept=".pdf" required /></label>
        </fieldset>

        <button type="submit">Submit application</button><span id="result" role="status"></span>
      </form>
    </main>
    <script>
      document.querySelector("#application").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#result").textContent = "Test form validated — nothing was sent.";
      });
    </script>
  </body>
</html>
